<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 710" role="img" aria-labelledby="title desc">
<title id="title">Scream system architecture</title><desc id="desc">Four request streams are routed to instrument-specific logic, standardized, validated and safely queued for system upload.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55ff00"/></marker><style>.box{fill:#101610;stroke:#55ff00;stroke-width:2}.t{fill:#f2f2f2;font:700 19px Arial,sans-serif;text-anchor:middle}.s{fill:#aaa;font:15px Arial,sans-serif;text-anchor:middle}.line{fill:none;stroke:#55ff00;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="980" height="710" rx="18" fill="#070a07"/>
<text class="t" x="490" y="38">REQUEST SOURCES</text>
<rect class="box" x="40" y="60" width="205" height="72" rx="12"/><text class="t" x="142" y="91">Ad-hoc</text><text class="s" x="142" y="115">Urgent setup requests</text>
<rect class="box" x="275" y="60" width="205" height="72" rx="12"/><text class="t" x="377" y="91">Daily</text><text class="s" x="377" y="115">OT market files</text>
<rect class="box" x="510" y="60" width="205" height="72" rx="12"/><text class="t" x="612" y="91">Weekly</text><text class="s" x="612" y="115">LNTT batch files</text>
<rect class="box" x="745" y="60" width="195" height="72" rx="12"/><text class="t" x="842" y="91">Quarterly</text><text class="s" x="842" y="115">Full refresh cycle</text>
<path class="line" d="M142 132v40h348M377 132v40M612 132v40h-122M842 132v40H490v18"/>
<rect class="box" x="245" y="190" width="490" height="78" rx="12"/><text class="t" x="490" y="223">Classify by Instrument</text><text class="s" x="490" y="247">Equity · Index · Basket · Equity Volatility</text>
<path class="line" d="M490 268v32"/>
<rect class="box" x="195" y="302" width="590" height="84" rx="12"/><text class="t" x="490" y="336">Normalize + Enrich</text><text class="s" x="490" y="362">Cross-system currency mappings · Sophis instrument list</text>
<path class="line" d="M490 386v32"/>
<rect class="box" x="195" y="420" width="590" height="84" rx="12"/><text class="t" x="490" y="454">Instrument-Specific Processing</text><text class="s" x="490" y="480">Parse inputs · apply business rules · aggregate history</text>
<path class="line" d="M490 504v32"/>
<rect class="box" x="195" y="538" width="590" height="82" rx="12"/><text class="t" x="490" y="571">Validate + Protect the Queue</text><text class="s" x="490" y="596">Scrub duplicates · prevent overwrite · respect freeze periods</text>
<path class="line" d="M490 620v30"/>
<rect class="box" x="300" y="654" width="380" height="42" rx="12"/><text class="t" x="490" y="682">Safe Upload + Reconciliation</text>
</svg>
