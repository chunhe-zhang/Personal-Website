<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Colline reconciliation flow</title><desc id="desc">Source data and Colline data are collected, reconciled, corrected where required and verified.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55ff00"/></marker><style>.box{fill:#101610;stroke:#55ff00;stroke-width:2}.decision{fill:#101610;stroke:#55ff00;stroke-width:2}.t{fill:#f2f2f2;font:700 20px Arial,sans-serif;text-anchor:middle}.s{fill:#aaa;font:15px Arial,sans-serif;text-anchor:middle}.line{fill:none;stroke:#55ff00;stroke-width:2.5;marker-end:url(#arrow)}.tag{fill:#55ff00;font:700 14px Arial,sans-serif}</style></defs>
<rect width="900" height="660" rx="18" fill="#070a07"/>
<rect class="box" x="275" y="28" width="350" height="72" rx="12"/><text class="t" x="450" y="59">Open Macro</text><text class="s" x="450" y="82">Enter date and credentials</text>
<path class="line" d="M450 100v28"/>
<rect class="box" x="215" y="130" width="470" height="82" rx="12"/><text class="t" x="450" y="163">Collect Source Data</text><text class="s" x="450" y="188">Bloomberg + Refinitiv · fill missing values</text>
<path class="line" d="M450 212v28"/>
<rect class="box" x="215" y="242" width="470" height="82" rx="12"/><text class="t" x="450" y="275">Scrape Colline</text><text class="s" x="450" y="300">Read the current records through Chrome or Edge</text>
<path class="line" d="M450 324v27"/>
<path class="decision" d="M450 350l150 70-150 70-150-70z"/><text class="t" x="450" y="414">Updates needed?</text><text class="s" x="450" y="439">Reconcile source and portal data</text>
<path class="line" d="M300 420H150v84"/>
<text class="tag" x="190" y="405">NO</text>
<rect class="box" x="45" y="508" width="210" height="78" rx="12"/><text class="t" x="150" y="541">Verified</text><text class="s" x="150" y="565">No correction required</text>
<path class="line" d="M600 420h150v84"/>
<text class="tag" x="676" y="405">YES</text>
<rect class="box" x="645" y="508" width="210" height="78" rx="12"/><text class="t" x="750" y="541">Apply Corrections</text><text class="s" x="750" y="565">Update Colline records</text>
<path class="line" d="M750 586v28H450v-15"/>
<rect class="box" x="315" y="600" width="270" height="46" rx="12"/><text class="t" x="450" y="630">Download + Verify</text>
</svg>
